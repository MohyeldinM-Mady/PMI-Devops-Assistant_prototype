name: PMI PR Analysis

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv
          uv pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt --index-url https://pypi.org/simple

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-qwen25-3b-pmi-v1
          restore-keys: |
            huggingface-qwen25-3b-pmi-

      - name: Collect project data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          uv run python -m src.collect

      - name: Build knowledge base
        run: |
          uv run python -m src.build_knowledge_base

      - name: Generate embeddings
        run: |
          uv run python -m src.Embeddings.main

      - name: Build vector database
        run: |
          uv run python -m src.VectorDB.main

      - name: Run PMI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run python -m src.DevOps.main